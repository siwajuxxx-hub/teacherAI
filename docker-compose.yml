version: '3.8'

services:
  backend:
    build: ./backend
    container_name: teacher-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - JWT_SECRET=change-me-in-production-use-a-strong-random-secret
      - ENCRYPTION_KEY=change-me-32-bytes-key-for-aes!
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: teacher-ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped